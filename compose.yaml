services:
  app:
    build: .
    image: yena
    container_name: yena
    working_dir: /app
    volumes:
      - .:/app
      - type: tmpfs
        target: /app/.yena
      - ./.yena:/data
      - ${YENA_WORKPLACE:-./workplace}:/workplace
    command: ["sleep", "infinity"]
    init: true
    environment:
      - TERM=xterm-256color
      - YENA_DATA=/data
      - ANTHROPIC_API_KEY
      - CLAUDE_CODE_OAUTH_TOKEN

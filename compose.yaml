services:
  app:
    build: .
    image: yena
    container_name: yena
    working_dir: /app
    # /app is the image: even root cannot change it. Writable places are the mounts and tmpfs below.
    read_only: true
    # Docker's default seccomp profile plus user namespaces for bubblewrap, the chat's Bash sandbox (SEC-12).
    # The path is relative to this folder: the yena script runs compose from here.
    security_opt:
      - seccomp=./seccomp.json
    volumes:
      - ./.yena:/data
      # Default: the folder holding this checkout, with the other projects next to it.
      - ${YENA_WORKPLACE:-..}:/workplace
      - .:/workplace/yena
      # The data (secrets included) is reachable only at /data, never through the checkout.
      - type: tmpfs
        target: /workplace/yena/.yena
      - stage:/stage
    tmpfs:
      # Docker mounts tmpfs noexec by default; tests and tools run scripts they write here.
      - /tmp:mode=1777,exec
      # npm cache, Claude CLI cache; nothing there has to survive a restart.
      - /root:mode=0700
    command: ["sleep", "infinity"]
    init: true
    environment:
      - TERM=xterm-256color
      - YENA_DATA=/data
      - ANTHROPIC_API_KEY
      - CLAUDE_CODE_OAUTH_TOKEN

volumes:
  stage: